name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'auth-bridge.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true

      - name: Prepare Standalone Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp privacy.html android/app/src/main/assets/ || true
          cp auth-bridge.html android/app/src/main/assets/ || true
          cp manifest.json android/app/src/main/assets/ || true
          cp icon-192.png android/app/src/main/assets/ || true
          cp icon-512.png android/app/src/main/assets/ || true
          echo "Assets bundled successfully:"
          ls -la android/app/src/main/assets/

      - name: Build Android APK with Gradle
        run: |
          set -e
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            echo "================ GRADLE BUILD FAILED ================"
            cat build.log
            exit 1
          }
          cd ..
          echo "=== Mencari file APK ==="
          find android -name "*.apk"
          APK_PATH=$(find android -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Tidak ditemukan file APK di folder android!"
            exit 1
          fi
          echo "Ditemukan APK pada: $APK_PATH"
          cp "$APK_PATH" dasbor-pribadi.apk
          ls -lh dasbor-pribadi.apk

      - name: Push Build Log on Failure
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          if [ -f android/build.log ]; then
            cp android/build.log ./gradle-failure.txt
            git add gradle-failure.txt
            git commit -m "chore: save build failure log"
            git push -f origin build-log || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasbor-pribadi-apk
          path: dasbor-pribadi.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Dasbor Pribadi Standalone APK v1.1.4 (Stable)"
          body: |
            ### 📱 Dasbor Pribadi 100% APK Mandiri — v1.1.4 (Stable)
            Rilis Kepatuhan & Perbaikan Resmi (Launch Readiness & Audit Fix): implementasi penuh standar aksesibilitas internasional **WCAG 2.1 (Discernible Button Text & aria-labels)**, perlindungan keamanan tingkat tinggi **Content-Security-Policy (CSP Level 3)**, standardisasi SEO kanonikal & Open Graph, serta dokumen transparansi pengguna mandiri **Kebijakan Privasi (Privacy Policy)**.
            
            - **Nama File**: `dasbor-pribadi.apk`
            - **Versi**: v1.1.4 (Stable)
            - **Pembaruan Utama di v1.1.4 (Stable)**:
              - ♿ **Kepatuhan Aksesibilitas WCAG 2.1 (A11y)**: Seluruh tombol ikonik, aksi dinamis (hapus subtask, transaksi, langganan, tabungan, geser widget, rating rekap harian) kini dilengkapi `aria-label` dan `title` deskriptif yang mendukung pembaca layar (screen reader) dan dwibahasa (ID/EN) tanpa merubah 1 piksel pun tampilan antarmuka visual.
              - 🛡️ **Keamanan Dokumen Content-Security-Policy (CSP Level 3)**: Penambahan tag meta CSP yang ketat namun fleksibel untuk mencegah serangan XSS/injection, mendukung Tailwind, FontAwesome, Google Auth, Firestore, UI-Avatars, dan Canvas Confetti.
              - 📜 **Halaman Kebijakan Privasi Mandiri (`privacy.html`)**: Halaman transparan dwibahasa (ID & EN) dengan navigasi kembali yang mulus, integrasi dark mode, dan rincian arsitektur offline-first, penyimpanan lokal, serta hak ekspor/reset data.
              - 🔍 **SEO Kanonikal & Open Graph Metadata**: Penambahan `<link rel="canonical">` resmi ke apex URL GitHub Pages dan metadata Open Graph lengkap untuk pratinjau tautan media sosial yang elegan.
              - 🌟 **Standardisasi Semantic Versioning 3 Tingkat**: Peningkatan versi resmi ke `v1.1.4 (Stable)` (`versionCode 110004`, Service Worker `dasbor-pwa-v1-1-4-stable`).
              - 🔔 **Dynamic Island State Machine Anti-Hilang & Rapid Jelly Checklist**: Semua penyempurnaan animasi cairan dan physics checklist dari v1.1.3 tetap berjalan optimal dengan performa tinggi 60 FPS.
          files: dasbor-pribadi.apk
          prerelease: false
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to Repository Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -f dasbor-pribadi.apk
          git commit -m "chore(release): update dasbor-pribadi.apk binary [skip ci]" || echo "Nothing to commit"
          git push origin main || echo "Git push skipped or failed"