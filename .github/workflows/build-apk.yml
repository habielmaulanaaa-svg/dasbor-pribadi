name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'auth-bridge.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | sdkmanager --licenses || true

      - name: Prepare Standalone Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp auth-bridge.html android/app/src/main/assets/ || true
          cp manifest.json android/app/src/main/assets/ || true
          cp icon-192.png android/app/src/main/assets/ || true
          cp icon-512.png android/app/src/main/assets/ || true
          echo "Assets bundled successfully:"
          ls -la android/app/src/main/assets/

      - name: Build Android APK with Gradle
        run: |
          set -e
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            echo "================ GRADLE BUILD FAILED ================"
            cat build.log
            exit 1
          }
          cd ..
          echo "=== Mencari file APK ==="
          find android -name "*.apk"
          APK_PATH=$(find android -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Tidak ditemukan file APK di folder android!"
            exit 1
          fi
          echo "Ditemukan APK pada: $APK_PATH"
          cp "$APK_PATH" dasbor-pribadi.apk
          ls -lh dasbor-pribadi.apk

      - name: Push Build Log on Failure
        if: failure()
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          if [ -f android/build.log ]; then
            cp android/build.log ./gradle-failure.txt
            git add gradle-failure.txt
            git commit -m "chore: save build failure log"
            git push -f origin build-log || true
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasbor-pribadi-apk
          path: dasbor-pribadi.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Dasbor Pribadi Standalone APK v1.1.0 (Stable)"
          body: |
            ### 📱 Dasbor Pribadi 100% APK Mandiri — v1.1.0 (Stable)
            Tonggak Rilis Fitur Resmi (MINOR Release) aplikasi manajemen keuangan & produktivitas pribadi: penambahan **Sistem Pilihan Bahasa Resmi Bilingual (Bahasa Indonesia 🇮🇩 & English 🇬🇧)** dengan mesin i18n zero-dependency, penyeragaman tata bahasa antarmuka, dan sinkronisasi lintas perangkat.
            
            - **Nama File**: `dasbor-pribadi.apk`
            - **Versi**: v1.1.0 (Stable)
            - **Pembaruan Utama di v1.1.0 (Stable)**:
              - 🌐 **Sistem Pilihan Bahasa Resmi (Bilingual i18n ID & EN)**: Beralih mulus antara Bahasa Indonesia dan English seketika tanpa reload halaman.
              - 🗣️ **Tata Bahasa Rapi & Bebas Campur Aduk**: Seluruh label antarmuka (Header, Dok Navigasi, Beranda, Manajemen Tugas, Keuangan, Jurnal, Pengaturan, hingga Dynamic Island Toast) kini 100% konsisten dalam bahasa terpilih.
              - 📅 **Format Tanggal Dinamis Cerdas**: Nama hari dan bulan pada kalender, riwayat transaksi, dan sub tugas otomatis menyesuaikan bahasa aktif (ID / EN).
              - 💾 **Persistensi & Cloud Sync Multibahasa**: Pilihan bahasa tersimpan aman di penyimpanan lokal HP / SQLite dan tersinkronisasi otomatis ke Google Cloud Firestore.
              - 🛡️ **Isolasi Lapisan Animasi Toast**: Animasi notifikasi dinamis responsif dengan dukungan pesan bilingual interaktif.
              - ⚡ **Pengaman Dobel Centang (Race Condition Guard)**: Tugas centang ganda berjalan mulus tanpa duplikasi status.
              - 🌟 **Skema Semantic Versioning (SemVer) 3 Tingkatan**: Naik ke versi MINOR `v1.1.0 (Stable)` sesuai standar perilisan fitur baru.
              - 🌊 **Universal CSS Grid Fluid Physics (0fr ➔ 1fr)**: Seluruh kartu dasbor mengembang dan mengempis secara alami.
              - 💧 **Indikator Kapsul Cairan Mengalir (*Liquid Mercury*)**: Dock Navigasi, Selector Bahasa, Speed-Dial FAB, dan Filter Transaksi.
              - 📊 **Filter Riwayat Transaksi Pas 100%**: Grid 5 kolom merata simetris (Semua, Hari Ini, Minggu Ini, Bulan Ini, Tahun Ini).
              - 💼 **Multi-Dompet & Kantong Keuangan**: Tunai, Rekening Bank, dan E-Wallet dengan peredaman bouncing denyut fluida.
              - 📅 **Sistem Sub-Tugas Cerdas**: Animasi cairan bar progres hijau mengalir, tanggal otomatis, dan toggle visibilitas fleksibel.
              - 🗓️ **Kalender Terpadu 360° & Diagram Analisis**: Kilas balik, pelacak tagihan rutin, sistem anggaran bulanan, dan skor kesehatan finansial.
              - 🔑 **Hybrid Auth Bridge & Google Cloud**: Dukungan login resmi Google dan pencadangan realtime 24/7.
              - 📱 **100% Standalone APK (Offline-First)**: Dibuka instan tanpa jaringan internet, dilengkapi mesin pembaruan latar belakang (OTA).
          files: dasbor-pribadi.apk
          prerelease: false
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to Repository Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -f dasbor-pribadi.apk
          git commit -m "chore(release): update dasbor-pribadi.apk binary [skip ci]" || echo "Nothing to commit"
          git push origin main || echo "Git push skipped or failed"