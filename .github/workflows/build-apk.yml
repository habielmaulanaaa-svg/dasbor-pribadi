name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Gradle
        run: |
          set -e
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            echo "================ GRADLE BUILD FAILED ================"
            cat build.log
            exit 1
          }
          cd ..
          echo "=== Mencari file APK ==="
          find android -name "*.apk"
          APK_PATH=$(find android -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Tidak ditemukan file APK di folder android!"
            exit 1
          fi
          echo "Ditemukan APK pada: $APK_PATH"
          cp "$APK_PATH" dasbor-pribadi.apk
          ls -lh dasbor-pribadi.apk

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          cp android/build.log ./gradle-failure.txt || true
          git add gradle-failure.txt
          git commit -m "chore: save build failure log"
          git push -f origin build-log

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasbor-pribadi-apk
          path: dasbor-pribadi.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Dasbor Pribadi Android App & Widget v33.10 Pro (APK)"
          body: |
            ### 📱 Dasbor Pribadi APK & Home Screen Widget (v33.10 Pro)
            Aplikasi resmi Android dengan dukungan **Widget Home Screen** dan **Pembaruan Otomatis (OTA)**.
            
            - **Nama File**: `dasbor-pribadi.apk`
            - **Versi**: v33.10 Pro
            - **Pembaruan Fitur Terbaru**:
              - 🔒 **Kunci Aplikasi Fleksibel**: Pilihan PIN 4-Digit & Kunci Pola 3x3 Interaktif (Opsi biometrik dihapus).
              - 🔑 **Pemulihan Lupa Password**: Fitur recovery pertanyaan keamanan rahasia tanpa kehilangan data keuangan.
              - ⏳ **Anti-Brute Force**: Cooldown timer (30 detik & 60 detik) dengan proteksi anti-reload.
              - 🌓 **Tema Layar Kunci Adaptif**: Desain responsif otomatis mengikuti Mode Gelap atau Terang.
              - 🧹 **Tampilan Lebih Ringkas**: Pembersihan grafik Arus Kas (Cash Flow) sesuai preferensi pengguna.
              - ⚡ **Optimasi Widget & Notifikasi**: Pindah posisi widget tanpa blank putih & antrean notifikasi anti-tabrakan.
          files: dasbor-pribadi.apk
          prerelease: false
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to Repository Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -f dasbor-pribadi.apk
          git commit -m "chore(release): update dasbor-pribadi.apk binary [skip ci]" || echo "Nothing to commit"
          git push origin main || echo "Git push skipped or failed"