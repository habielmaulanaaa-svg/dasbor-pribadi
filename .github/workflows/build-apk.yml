name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'auth-bridge.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Standalone Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp auth-bridge.html android/app/src/main/assets/ || true
          cp manifest.json android/app/src/main/assets/ || true
          cp icon-192.png android/app/src/main/assets/ || true
          cp icon-512.png android/app/src/main/assets/ || true
          echo "Assets bundled successfully:"
          ls -la android/app/src/main/assets/

      - name: Build Android APK with Gradle
        run: |
          set -e
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            echo "================ GRADLE BUILD FAILED ================"
            cat build.log
            exit 1
          }
          cd ..
          echo "=== Mencari file APK ==="
          find android -name "*.apk"
          APK_PATH=$(find android -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Tidak ditemukan file APK di folder android!"
            exit 1
          fi
          echo "Ditemukan APK pada: $APK_PATH"
          cp "$APK_PATH" dasbor-pribadi.apk
          ls -lh dasbor-pribadi.apk

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          cp android/build.log ./gradle-failure.txt || true
          git add gradle-failure.txt
          git commit -m "chore: save build failure log"
          git push -f origin build-log

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasbor-pribadi-apk
          path: dasbor-pribadi.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Dasbor Pribadi Standalone APK (Liquid Mood Pill & Grid 5 Pas) v33.24.OTA"
          body: |
            ### 📱 Dasbor Pribadi 100% APK Mandiri (v33.24.OTA)
            Aplikasi resmi Android 100% Mandiri (**Offline-First**) kini hadir dengan **Kapsul Cairan Suasana Hati (Liquid Mood Mercury Pill)**, **Filter Riwayat Transaksi Pas 100% (Grid 5 Kolom)**, **Reduksi Bouncing Kartu Dompet & Multi-Dompet**, **Standardisasi Seluruh Animasi Dasbor ke Era Cairan (Fluid Physics)**, **Universal CSS Grid Accordion (0fr ➔ 1fr)** pada seluruh Stack Kartu (Deadline, Reguler, Selesai, Riwayat Keuangan, Tabungan Tercapai, dan Widget Beranda), **Drawer Formulir Mengalir Murni Tanpa Bouncing**, **Sub-Bar Waktu Grid Fluida**, **Rotasi Panah Chevron Sinkron Presisi**, **Animasi Cairan Bar Sub-Tugas Hijau Mengalir**, **Penyematan Tanggal Otomatis (Tanpa Waktu)**, **Akselerasi 120 FPS & Zero Lag**, **Selective Reset Data**, **Hybrid Auth Bridge** (Google Login Lancar Resmi), **Pembaruan Otomatis (OTA)**, **Widget Home Screen**, dan **Sinkronisasi Cloud Storage**.
            
            - **Nama File**: `dasbor-pribadi.apk`
            - **Versi**: v33.24.OTA
            - **Fitur Baru v33.24.OTA**:
              - 💧 **Kapsul Cairan Suasana Hati (Liquid Mood Mercury Pill)**: Menggantikan animasi membal/pantul kasar tombol suasana hati jurnal dengan kapsul merkuri cair fluida murni yang meluncur mengalir mulus layaknya dock navigasi dan tombol FAB saat memilih emoji.
              - 📊 **Filter Riwayat Transaksi Pas 100% (Grid 5 Kolom)**: Menghilangkan ruang kosong di sebelah kanan filter riwayat transaksi, kini tersusun merata dan pas 100% (Semua, Hari Ini, Minggu Ini, Bulan Ini, Tahun Ini) lengkap dengan logika filter per pekan dan tahun di JavaScript.
              - 💼 **Reduksi Bouncing Kartu Kantong & Dompet**: Mengurangi animasi bouncing berlebih kartu dompet (tunai/bank/e-wallet) saat dipilih menjadi denyut fluida alami yang tenang.
              - 🌊 **Standardisasi CSS Grid Fluid Physics Universal (0fr ➔ 1fr)**: Seluruh stack kartu dasbor (Tugas Deadline, Reguler, Selesai, Riwayat Keuangan, Tabungan Tercapai, dan Widget Beranda) telah ditingkatkan ke teknologi CSS Grid fluida murni.
              - ⚡ **Eliminasi Delay Kosong & Bouncing Kasar**: Menghapus `max-height: 2500px` dan keyframes spring kasar, digantikan oleh durasi konstan alami dan kurva deselerasi murni (*Quart Ease-Out* `cubic-bezier(0.25, 1, 0.5, 1)`).
              - 📝 **Drawer Formulir & Sub-Bar Waktu Fluida**: Form Tugas Baru, Jurnal, Target Tabungan, Banner APK, dan Sub-Bar Waktu Tugas meluncur mulus seperti cairan.
              - 🧭 **Rotasi Panah Chevron Presisi Terpadu**: Seluruh ikon panah indikator berputar tepat 180° seirama dengan cairan kartu tanpa getaran.
              - 🪶 **Anti-Bounce & Isolasi Padding**: Nol lompatan viewport layout dan margin/padding internal terisolasi sempurna pada tinggi 0px.
              - 🌊 **Animasi Cairan Bar Sub-Tugas (Liquid Flow Bar)**: Bar progres sub-tugas hijau mengalir halus ke kanan dengan efek denyut cairan saat dicentang.
              - 📅 **Penyematan Tanggal Otomatis (Tanpa Waktu)**: Format tanggal, bulan, dan tahun tanpa jam/menit (contoh: 18 Sep 2026).
              - 👁️ **Opsi Sembunyikan & Tampilkan Tanggal**: Kontrol penuh visibilitas tanggal sub-tugas.
              - 🚀 **Akselerasi 120 FPS & Zero Lag**: Navigasi dan scrolling super halus bebas reflow thrashing.
              - 🔑 **Hybrid Auth Bridge**: Login Google resmi lancar 100% tanpa kendala.
              - 📱 **100% Standalone APK (Offline-First)**: Dibuka instan tanpa butuh koneksi internet sama sekali.
              - 🚀 **Pembaruan Otomatis (OTA)**: Fitur terbaru diperbarui di latar belakang tanpa harus install APK ulang.
          files: dasbor-pribadi.apk
          prerelease: false
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to Repository Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -f dasbor-pribadi.apk
          git commit -m "chore(release): update dasbor-pribadi.apk binary [skip ci]" || echo "Nothing to commit"
          git push origin main || echo "Git push skipped or failed"