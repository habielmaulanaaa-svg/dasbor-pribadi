name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
      - 'index.html'
      - 'auth-bridge.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Standalone Assets
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp auth-bridge.html android/app/src/main/assets/ || true
          cp manifest.json android/app/src/main/assets/ || true
          cp icon-192.png android/app/src/main/assets/ || true
          cp icon-512.png android/app/src/main/assets/ || true
          echo "Assets bundled successfully:"
          ls -la android/app/src/main/assets/

      - name: Build Android APK with Gradle
        run: |
          set -e
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            echo "================ GRADLE BUILD FAILED ================"
            cat build.log
            exit 1
          }
          cd ..
          echo "=== Mencari file APK ==="
          find android -name "*.apk"
          APK_PATH=$(find android -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Tidak ditemukan file APK di folder android!"
            exit 1
          fi
          echo "Ditemukan APK pada: $APK_PATH"
          cp "$APK_PATH" dasbor-pribadi.apk
          ls -lh dasbor-pribadi.apk

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          cp android/build.log ./gradle-failure.txt || true
          git add gradle-failure.txt
          git commit -m "chore: save build failure log"
          git push -f origin build-log

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasbor-pribadi-apk
          path: dasbor-pribadi.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Dasbor Pribadi Standalone APK (Offline-First + Fluid Spring Physics) v33.15.OTA"
          body: |
            ### 📱 Dasbor Pribadi 100% APK Mandiri (v33.15.OTA)
            Aplikasi resmi Android 100% Mandiri (**Offline-First**) tanpa ketergantungan web browser, kini hadir dengan **Era Fisika Fluida & Pantulan (Fluid Spring Physics)**, **Hybrid Auth Bridge** (Google Login Lancar Resmi), **Pembaruan Otomatis (OTA)**, **Widget Home Screen**, dan **Sinkronisasi Cloud Storage**.
            
            - **Nama File**: `dasbor-pribadi.apk`
            - **Versi**: v33.15.OTA
            - **Fitur Baru v33.15.OTA**:
              - 🧲 **Rubber-band Swipe Snap**: Redaman karet non-linear (iOS viscous damping) pada kartu tugas dengan pantulan pegas alami (*overshoot snap-back*).
              - 💧 **Liquid Filter Pill**: Kapsul air raksa presisi meluncur mulus membungkus tab rentang waktu transaksi tanpa pergeseran vertikal.
              - 📜 **Spring Accordion Unfurl**: Animasi membuka formulir input (Tugas, Jurnal, Tabungan) yang melar kenyal hardware-accelerated.
              - 🌊 **Jelly Pulse & Mode Solid Bersih**: Respon fluida mikro kartu saldo saat disentuh/transaksi, dengan proteksi tanpa kebocoran glow saat gradasi dimatikan.
              - 🛡️ **Pembersihan Bug Menu Pengaturan**: Menghilangkan bug pantulan tidak sengaja pada baris toggle saat membuka Opsi Tampilan & Sistem.
              - 🔑 **Hybrid Auth Bridge**: Login Google resmi lancar 100% tanpa kendala "The requested action is invalid".
              - 📱 **100% Standalone APK (Offline-First)**: Dibuka instan tanpa butuh koneksi internet sama sekali.
              - 🚀 **Pembaruan Otomatis (OTA)**: Fitur terbaru diperbarui di latar belakang tanpa harus install APK ulang.
          files: dasbor-pribadi.apk
          prerelease: false
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to Repository Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -f dasbor-pribadi.apk
          git commit -m "chore(release): update dasbor-pribadi.apk binary [skip ci]" || echo "Nothing to commit"
          git push origin main || echo "Git push skipped or failed"