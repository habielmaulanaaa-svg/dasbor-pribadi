name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Gradle
        run: |
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee gradle-build.log

      - name: Report Build Log on Failure
        if: failure()
        run: |
          echo "### Gradle Build Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 android/gradle-build.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Prepare APK File
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk dasbor-pribadi.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasbor-pribadi-apk
          path: dasbor-pribadi.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Dasbor Pribadi Android App & Widget (APK)"
          body: |
            ### 📱 Dasbor Pribadi APK & Home Screen Widget
            Aplikasi resmi Android dengan dukungan **Widget Home Screen** dan **Pembaruan Otomatis (OTA)**.
            
            - **Nama File**: `dasbor-pribadi.apk`
            - **Versi**: v32.35 Pro
            - **Fitur**: Home Screen Widget (+ Masuk, - Keluar, Catatan, Kalkulator), Google Auth, Firebase Cloud Storage, dan OTA Update.
          files: dasbor-pribadi.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}