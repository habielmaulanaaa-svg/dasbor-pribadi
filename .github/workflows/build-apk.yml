name: Build Android APK & Release

on:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android APK with Gradle
        run: |
          set -e
          sed -i 's/\r$//' android/gradlew
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace > build.log 2>&1 || {
            echo "================ GRADLE BUILD FAILED ================"
            cat build.log
            exit 1
          }
          cd ..
          echo "=== Mencari file APK ==="
          find android -name "*.apk"
          APK_PATH=$(find android -name "*debug.apk" -o -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Tidak ditemukan file APK di folder android!"
            exit 1
          fi
          echo "Ditemukan APK pada: $APK_PATH"
          cp "$APK_PATH" dasbor-pribadi.apk
          ls -lh dasbor-pribadi.apk

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build-log
          cp android/build.log ./gradle-failure.txt || true
          git add gradle-failure.txt
          git commit -m "chore: save build failure log"
          git push -f origin build-log

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dasbor-pribadi-apk
          path: dasbor-pribadi.apk

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: apk-latest
          name: "Dasbor Pribadi Android App & Widget v33.11.P5 (APK)"
          body: |
            ### 📱 Dasbor Pribadi APK & Home Screen Widget (v33.11.P5)
            Aplikasi resmi Android dengan dukungan **Widget Home Screen**, **Animasi Fluida Alami**, dan **Pembaruan Otomatis (OTA)**.
            
            - **Nama File**: `dasbor-pribadi.apk`
            - **Versi**: v33.11.P5
            - **Pembaruan Fitur Terbaru**:
              - 🌊 **Gelombang Fluida Saldo 100% Seamless**: Animasi gelombang tangki saldo mengalir berputar tanpa patahan sambungan dan bebas stuttering (*infinite smooth laminar flow*).
              - 🚤 **Dok Navigasi & FAB Terpadu (*Smooth Surface*)**: Seluruh kapsul navigasi (Beranda, Tugas, Uang) dan tombol aksi cepat FAB serempak menyelam saat scroll ke bawah dan meluncur naik mulus tanpa efek pantulan kaku saat scroll ke atas.
              - ✨ **Restorasi Murni Frosted Glass & Eliminasi Outline**: Tampilan kaca buram akrilik murni (`backdrop-filter: blur(20px) saturate(180%)`) pada bilah dok dan FAB, bebas dari gangguan isolasi layer GPU dan bersih total dari garis outline tebal buatan.
              - 💧 **Saklar Liquid Glass Waktu Pembuatan Tugas**: Opsi waktu & tanggal dibuat pada form tugas baru dengan animasi peregangan cairan (*stretch & detach*) serta transisi buka-tutup sub-bar yang halus.
              - 🧹 **Optimalisasi Kinerja Bersih**: Pembersihan total modul kunci internal untuk performa maksimal dan kecepatan akses harian.
          files: dasbor-pribadi.apk
          prerelease: false
          draft: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to Repository Root
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B main
          git add -f dasbor-pribadi.apk
          git commit -m "chore(release): update dasbor-pribadi.apk binary [skip ci]" || echo "Nothing to commit"
          git push origin main || echo "Git push skipped or failed"